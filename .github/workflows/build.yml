name: build

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t site:${{ github.sha }} site

      - name: Show image
        run: docker images site
